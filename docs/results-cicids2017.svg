<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1400" height="620" fill="#fcfcfb"/>
<text x="70" y="34" font-size="19" font-weight="600" fill="#1a1a19">F1 and zero-day recall by feedback delay D, CIC-IDS2017 paper-v2 split</text>
<text x="70" y="56" fill="#6b6a63">The label of each flow comes back D flows after it was judged. Jev IDS is the mean of 3 runs. Each baseline ran once, refitted at every step on the same memory as Jev.</text>
<text x="70" y="74" fill="#6b6a63">F1 counts all 980 attacks and all 1,020 benign flows. Zero-day recall is the share of the 293 flows of the three attack names absent from the starting memory that raised an alert.</text>
<text x="70" y="92" fill="#6b6a63">Jev IDS reads its verdict at p_attack ≥ 0.58 and the baselines at 0.5. The delays are evenly spaced on the x axis.</text>
<rect x="70" y="114" width="22" height="3" fill="#2a78d6"/><circle cx="81.0" cy="115.5" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="100" y="120" fill="#1a1a19">Jev IDS (mean of 3 runs)</text>
